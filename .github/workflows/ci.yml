name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore VetClinicManager.sln

      - name: Build
        run: dotnet build VetClinicManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VetClinicManager.sln --configuration Release --no-build --verbosity normal
